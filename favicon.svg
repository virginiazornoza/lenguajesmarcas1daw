<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado con sutil borde azul -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Símbolo </> en azul brillante -->
  <text x="32" y="38" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', 'Plus Jakarta Sans', system-ui, -apple-system, monospace, sans-serif" font-weight="900" font-size="26" fill="#38bdf8" letter-spacing="-1">&lt;/&gt;</text>
</svg>
